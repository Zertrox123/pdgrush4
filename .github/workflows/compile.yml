name: compile test

on:
  push:

jobs:
    build-ubuntu:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |
                   sudo apt update
                   sudo apt install -y libsfml-dev build-essential libncurses-dev
            - run: make
    build-arch:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
                steps:
                    - run: pacman -Sy --noconfirm git sfml ncurses base-devel
                    - uses: actions/checkout@v4
                    - run: make
